<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - EasyCoding</title>
  <link rel="stylesheet" href="css/bootstrap.css" />
  <link rel="stylesheet" href="css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    
    .auth-card {
      background: rgb(47, 47, 47);
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      padding: 45px;
      max-width: 450px;
      width: 100%;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 35px;
    }
    
    .auth-icon {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 15px;
      display: block;
    }
    
    .auth-header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 5px;
      font-weight: 700;
    }
    
    .auth-header p {
      color: #999;
      font-size: 14px;
      margin: 0;
    }
    
    .form-group label {
      color: #f5f0f0;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .form-control {
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-control::placeholder {
      color: #ccc;
    }
    
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      margin-top: 15px;
      transition: all 0.3s ease;
      font-size: 16px;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      color: white;
    }
    
    .btn-login:active {
      transform: translateY(0);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #171515;
    }
    
    .auth-footer p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .auth-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .auth-footer a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      margin-top: 15px;
    }
    
    .remember-me input[type="checkbox"] {
      margin-right: 8px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .remember-me label {
      color: #666;
      font-size: 14px;
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: 12px;
    }
    
    .forgot-password a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.3s ease;
    }
    
    .forgot-password a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    /* Navbar styling for auth pages */
    .header_section {
      padding: 15px 0;
    }
    
    .header_section .navbar-brand span {
      font-weight: bold;
      font-size: 32px;
      color: #ffffff;
    }
    
    .header_section .nav-link {
      color: #120e0e !important;
      padding: 5px 20px;
      text-transform: uppercase;
      border-radius: 5px;
      transition: all 0.3s;
    }
    
    .header_section .nav-link:hover {
      color: #667eea !important;
      background-color: black;
      margin-left: 10px;
    }
    
    .header_section .order_online {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: black;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      transition: all 0.3s;
    }
    
    .header_section .order_online:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      color: black !important;
    }
    
    @media (max-width: 576px) {
      .auth-card {
        padding: 30px 20px;
      }
      
      .auth-header h1 {
        font-size: 24px;
      }
      
      .auth-icon {
        font-size: 40px;
      }
    }

    


  </style>
</head>
<body>
  <!-- header section -->
  <header class="header_section" style="position: relative; z-index: 1000; background: rgba(34, 40, 49, 0.95);">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="index.html">
          <span>EasyCoding</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class=""></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a style="color: white !important;" class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a style="color: white !important;" class="nav-link" href="menu.html">Courses</a>
            </li>
            <li class="nav-item">
              <a style="color: white !important;" class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a style="color: white !important;" class="nav-link" href="book.html">Enroll Now</a>
            </li>
          </ul>
          <div class="user_option">
            <a href="signup.html" class="order_online" aria-label="Sign up">Sign Up</a>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <!-- end header section -->
  
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <i class="auth-icon fa fa-sign-in" aria-hidden="true"></i>
        <h1>Welcome Back</h1>
        <p>Sign in to your EasyCoding account</p>
      </div>
      
      <form action="#" method="post" aria-label="Login form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            id="email" 
            name="email" 
            type="email" 
            class="form-control" 
            placeholder="you@example.com" 
            required
            aria-required="true"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required
            aria-required="true"
          >
        </div>
        
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember" aria-label="Remember me">
          <label for="remember">Remember me</label>
        </div>
        
        <div class="forgot-password">
          <a href="#" aria-label="Forgot password">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-login" aria-label="Sign in button">Sign In</button>
      </form>
      
      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html" aria-label="Go to signup page">Create one</a></p>
      </div>
    </div>
  </div>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
</body>
</html>
