<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up - EasyCoding</title>
  <link rel="stylesheet" href="css/bootstrap.css" />
  <link rel="stylesheet" href="css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    
    .auth-card {
      background: rgb(47, 47, 47);
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      padding: 45px;
      max-width: 480px;
      width: 100%;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 35px;
    }
    
    .auth-icon {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 15px;
      display: block;
    }
    
    .auth-header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 5px;
      font-weight: 700;
    }
    
    .auth-header p {
      color: #999;
      font-size: 14px;
      margin: 0;
    }
    
    .form-group label {
      color: white;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .form-control {
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-control::placeholder {
      color: #ccc;
    }
    
    .btn-signup {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      margin-top: 15px;
      transition: all 0.3s ease;
      font-size: 16px;
    }
    
    .btn-signup:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      color: white;
    }
    
    .btn-signup:active {
      transform: translateY(0);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #e8e8e8;
    }
    
    .auth-footer p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .auth-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .auth-footer a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    .password-hint {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    
    /* Navbar styling for auth pages */
    .header_section {
      padding: 15px 0;
    }
    
    .header_section .navbar-brand span {
      font-weight: bold;
      font-size: 32px;
      color: #ffffff;
    }
    
    .header_section .nav-link {
      color: #ffffff !important;
      padding: 5px 20px;
      text-transform: uppercase;
      border-radius: 5px;
      transition: all 0.3s;
    }
    
    .header_section .nav-link:hover {
      color: #667eea !important;
      background-color: white;
      margin-left: 10px;
    }
    
    .header_section .order_online {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      transition: all 0.3s;
    }
    
    .header_section .order_online:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      color: white;
    }
    
    @media (max-width: 576px) {
      .auth-card {
        padding: 30px 20px;
      }
      
      .auth-header h1 {
        font-size: 24px;
      }
      
      .auth-icon {
        font-size: 40px;
      }
    }

    /* Dark Mode CSS Variables */
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --secondary-text: #666666;
      --border-color: #e8e8e8;
      --card-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.95);
      --shadow: rgba(0, 0, 0, 0.08);
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --text-color: #e8e8e8;
      --secondary-text: #b0b0b0;
      --border-color: #333333;
      --card-bg: #2a2a2a;
      --header-bg: rgba(26, 26, 26, 0.95);
      --shadow: rgba(0, 0, 0, 0.3);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.dark-mode .auth-card {
      background-color: var(--card-bg);
      color: var(--text-color);
      box-shadow: 0 10px 40px var(--shadow);
    }

    body.dark-mode .auth-header h1 {
      color: var(--text-color);
    }

    body.dark-mode .auth-header p {
      color: var(--secondary-text);
    }


  </style>
</head>
<body>
  <!-- header section -->
  <header class="header_section" style="position: relative; z-index: 1000; background: rgba(34, 40, 49, 0.95);">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="index.html">
          <span>EasyCoding</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class=""></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Courses</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="book.html">Enroll Now</a>
            </li>
          </ul>
          <div class="user_option">
            <a href="login.html" class="order_online" aria-label="Sign in">Sign In</a>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <!-- end header section -->
  
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <i class="auth-icon fa fa-user-plus" aria-hidden="true"></i>
        <h1>Create Account</h1>
        <p>Join EasyCoding community today</p>
      </div>
      
      <form action="#" method="post" aria-label="Signup form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input 
            id="name" 
            name="name" 
            type="text" 
            class="form-control" 
            placeholder="John Doe" 
            required
            aria-required="true"
          >
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            id="email" 
            name="email" 
            type="email" 
            class="form-control" 
            placeholder="you@example.com" 
            required
            aria-required="true"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            class="form-control" 
            placeholder="Create a strong password" 
            required
            aria-required="true"
          >
          <div class="password-hint">✓ Use at least 8 characters, numbers and symbols</div>
        </div>
        
        <button type="submit" class="btn btn-signup" aria-label="Sign up button">Create Account</button>
      </form>
      
      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" aria-label="Go to login page">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
</body>
</html>
