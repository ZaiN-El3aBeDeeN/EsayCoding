<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Cart - EasyCoding</title>
  <link rel="stylesheet" href="css/bootstrap.css" />
  <link rel="stylesheet" href="css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .order-page {
      background: #f39b20;
      padding: 60px 20px;
      min-height: 100vh;
    }
    
    .order-header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .order-header h1 {
      font-size: 36px;
      color: #333;
      margin-bottom: 10px;
      font-weight: 700;
    }
    
    .order-header p {
      color: #666;
      font-size: 16px;
    }
    
    .cart-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .cart-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 30px;
    }
    
    .cart-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .cart-header i {
      font-size: 24px;
    }
    
    .cart-body {
      padding: 30px;
    }
    
    .cart-items-list {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #e8e8e8;
      transition: background 0.3s ease;
    }
    
    .cart-item:last-child {
      border-bottom: none;
    }
    
    .cart-item:hover {
      background: #f9f9f9;
      padding: 15px 10px;
      border-radius: 8px;
      margin: 0 -10px;
      padding-left: 0;
      padding-right: 0;
    }
    
    .item-info {
      flex: 1;
    }
    
    .item-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      font-size: 15px;
    }
    
    .item-details {
      font-size: 13px;
      color: #999;
    }
    
    .item-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .qty-control {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f5f5f5;
    }
    
    .qty-btn {
      background: none;
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
      color: #666;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    
    .qty-btn:hover {
      background: #ddd;
      color: #333;
    }
    
    .qty-display {
      min-width: 30px;
      text-align: center;
      font-weight: 600;
      color: #333;
    }
    
    .item-price {
      min-width: 80px;
      text-align: right;
      font-weight: 600;
      color: #667eea;
      font-size: 16px;
    }
    
    .remove-btn {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      padding: 5px;
    }
    
    .remove-btn:hover {
      color: #c0392b;
      transform: scale(1.2);
    }
    
    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .empty-cart i {
      font-size: 64px;
      color: #ddd;
      margin-bottom: 20px;
      display: block;
    }
    
    .empty-cart p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    
    .empty-cart a {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .empty-cart a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      color: white;
    }
    
    .cart-summary {
      background: #f5f5f5;
      padding: 25px 30px;
      border-radius: 0 0 12px 12px;
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 15px;
      color: #666;
    }
    
    .summary-row.total {
      border-top: 2px solid #ddd;
      padding-top: 15px;
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }
    
    .summary-row.total .amount {
      color: #667eea;
      font-size: 22px;
    }
    
    .checkout-actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }
    
    .btn-checkout {
      flex: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .btn-checkout:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      color: white;
    }
    
    .btn-continue {
      flex: 1;
      background: white;
      border: 2px solid #e8e8e8;
      color: #667eea;
      padding: 15px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-continue:hover {
      border-color: #667eea;
      color: #667eea;
      background: #f9f9f9;
    }
    
    @media (max-width: 576px) {
      .order-header h1 {
        font-size: 28px;
      }
      
      .cart-item {
        flex-wrap: wrap;
      }
      
      .item-price {
        min-width: auto;
        margin-top: 10px;
        width: 100%;
        text-align: right;
      }
      
      .checkout-actions {
        flex-direction: column;
      }
    }

    /* Dark Mode CSS Variables */
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --secondary-text: #666666;
      --border-color: #e8e8e8;
      --card-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.95);
      --shadow: rgba(0, 0, 0, 0.08);
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --text-color: #e8e8e8;
      --secondary-text: #b0b0b0;
      --border-color: #333333;
      --card-bg: #2a2a2a;
      --header-bg: rgba(26, 26, 26, 0.95);
      --shadow: rgba(0, 0, 0, 0.3);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.dark-mode .cart-card {
      background-color: var(--card-bg);
      color: var(--text-color);
      box-shadow: 0 5px 15px var(--shadow);
    }

    body.dark-mode .order-header h1,
    body.dark-mode .order-header h2 {
      color: var(--text-color);
    }

    body.dark-mode .cart-item {
      border-bottom-color: var(--border-color);
    }

    body.dark-mode .cart-item p {
      color: var(--text-color);
    }

    body.dark-mode .item-controls input {
      background-color: var(--card-bg);
      color: var(--text-color);
      border-color: var(--border-color);
    }

    body.dark-mode .cart-summary {
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
    }

    body.dark-mode .summary-row {
      color: var(--text-color);
    }

    body.dark-mode .summary-row.total {
      color: #667eea;
      border-top: 1px solid var(--border-color);
    }

    body.dark-mode .btn-checkout {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    body.dark-mode .btn-checkout:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3f8f 100%);
    }

    body.dark-mode .btn-continue {
      color: #667eea;
      border-color: #667eea;
    }


  </style>
</head>
<body>
  <header class="header_section">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="index.html">
          <span>EasyCoding</span>
        </a>
      </nav>
    </div>
  </header>

  <div class="order-page">
    <div class="order-header">
      <h1>🛒 Shopping Cart</h1>
      <p>Review your items and proceed to checkout</p>
    </div>

    <div class="cart-container">
      <div class="cart-card">
        <div class="cart-header">
          <i class="fa fa-shopping-bag"></i>
          Your Items
        </div>
        
        <div class="cart-body">
          <div id="cart-items" class="cart-items-list">
            <!-- items rendered here by js/custom.js -->
          </div>
          
          <div id="empty-cart-message" class="empty-cart" style="display:none;">
            <i class="fa fa-inbox"></i>
            <p>Your cart is empty</p>
            <a href="menu.html" aria-label="Continue shopping">Continue Shopping</a>
          </div>
        </div>
        
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span>$<span id="cart-subtotal">0</span></span>
          </div>
          <div class="summary-row">
            <span>Tax (10%):</span>
            <span>$<span id="cart-tax">0</span></span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span class="amount">$<span id="cart-total">0</span></span>
          </div>
          
          <div class="checkout-actions">
            <a href="menu.html" class="btn-continue" aria-label="Continue shopping">
              <i class="fa fa-arrow-left"></i> Continue Shopping
            </a>
            <button id="checkout-btn" class="btn-checkout" aria-label="Proceed to checkout">
              <i class="fa fa-credit-card"></i> Checkout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="config.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/custom.js"></script>
  <script>
    // Update cart display on page load and when cart changes
    function updateOrderPage() {
      const cart = getCart();
      const emptyMsg = document.getElementById('empty-cart-message');
      const cartItems = document.getElementById('cart-items');
      
      if (cart.length === 0) {
        cartItems.innerHTML = '';
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        renderCart();
      }
    }
    
    document.addEventListener('DOMContentLoaded', updateOrderPage);
  </script>
</body>
</html>
